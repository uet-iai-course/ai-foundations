<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1081 63" role="img" data-redrawn="manual" aria-labelledby="title desc"><title id="title">Quan hệ ưa thích A hơn B</title><desc id="desc">A ≻ B: A preferred over B.</desc><rect width="100%" height="100%" fill="white"/><text x="2" y="50" font-size="59" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="214" lengthAdjust="spacingAndGlyphs" font-style="italic">A ≻ B</text><text x="425" y="50" font-size="59" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="654" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">A</tspan> preferred over <tspan font-style="italic">B</tspan></text></svg>
