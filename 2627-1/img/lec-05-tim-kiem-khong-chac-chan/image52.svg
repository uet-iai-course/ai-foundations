<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 408" role="img" data-redrawn="manual" aria-labelledby="title desc"><title id="title">Trả 30 đô la và xổ số tương đương</title><desc id="desc">pay $30 ∼ L; hai nhánh xác suất 0.999999 continue as before và 0.000001 instant death.</desc><rect width="100%" height="100%" fill="white"/><text x="40" y="258" font-size="115" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="383" lengthAdjust="spacingAndGlyphs" font-weight="bold">pay $30</text><text x="543" y="258" font-size="109" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="65" lengthAdjust="spacingAndGlyphs" font-weight="bold">∼</text><text x="925" y="246" font-size="65" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="black" textLength="40" lengthAdjust="spacingAndGlyphs" font-style="italic">L</text><text x="1062" y="104" font-size="65" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="black" textLength="220" lengthAdjust="spacingAndGlyphs" font-style="italic">0.999999</text><text x="1055" y="374" font-size="65" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="black" textLength="220" lengthAdjust="spacingAndGlyphs" font-style="italic">0.000001</text><text x="1450" y="62" font-size="66" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="515" lengthAdjust="spacingAndGlyphs" font-weight="bold">continue as before</text><text x="1450" y="397" font-size="66" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="365" lengthAdjust="spacingAndGlyphs" font-weight="bold">instant death</text><path d="M1005 222 L1411 67 M1005 222 L1408 378" stroke="black" stroke-width="5" fill="none"/><path d="M1392 61 L1440 54 L1401 79 Z M1400 364 L1440 390 L1393 379 Z" fill="black"/></svg>
