<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1247 797" role="img" data-redrawn="manual" aria-labelledby="title desc"><title id="title">Các tiên đề về tính hợp lý</title><desc id="desc">Orderability, Transitivity, Continuity, Substitutability và Monotonicity, với các biểu thức quan hệ ưa thích và xổ số tương ứng.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="1" y="39" font-size="51" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="320" lengthAdjust="spacingAndGlyphs">Orderability</text><path d="M1 52 H320" stroke="black" stroke-width="2"/><text x="1" y="189" font-size="51" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="305" lengthAdjust="spacingAndGlyphs">Transitivity</text><path d="M1 202 H305" stroke="black" stroke-width="2"/><text x="1" y="339" font-size="51" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="280" lengthAdjust="spacingAndGlyphs">Continuity</text><path d="M1 352 H280" stroke="black" stroke-width="2"/><text x="1" y="489" font-size="51" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="410" lengthAdjust="spacingAndGlyphs">Substitutability</text><path d="M1 502 H410" stroke="black" stroke-width="2"/><text x="1" y="639" font-size="51" font-family="Arial, Liberation Sans, sans-serif" fill="black" textLength="355" lengthAdjust="spacingAndGlyphs">Monotonicity</text><path d="M1 652 H355" stroke="black" stroke-width="2"/><text x="89" y="112" font-size="62" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="775" lengthAdjust="spacingAndGlyphs" font-style="italic">(A ≻ B) ∨ (B ≻ A) ∨ (A ∼ B)</text><text x="89" y="262" font-size="62" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="800" lengthAdjust="spacingAndGlyphs" font-style="italic">(A ≻ B) ∧ (B ≻ C) ⇒ (A ≻ C)</text><text x="89" y="412" font-size="62" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="965" lengthAdjust="spacingAndGlyphs" font-style="italic">A ≻ B ≻ C ⇒ ∃p [p, A; 1 − p, C] ∼ B</text><text x="89" y="562" font-size="62" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="1080" lengthAdjust="spacingAndGlyphs" font-style="italic">A ∼ B ⇒ [p, A; 1 − p, C] ∼ [p, B; 1 − p, C]</text><text x="89" y="710" font-size="62" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="240" lengthAdjust="spacingAndGlyphs" font-style="italic">A ≻ B ⇒</text><text x="147" y="778" font-size="58" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="1096" lengthAdjust="spacingAndGlyphs" font-style="italic">(p ≥ q ⇔ [p, A; 1 − p, B] ⪰ [q, A; 1 − q, B])</text></svg>
