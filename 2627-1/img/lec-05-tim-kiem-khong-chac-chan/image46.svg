<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1417 231" role="img" data-redrawn="manual" aria-labelledby="title desc"><title id="title">Hàm lợi ích và kì vọng lợi ích</title><desc id="desc">U(A) ≥ U(B) ⇔ A ⪰ B; U([p₁, S₁; …; pₙ, Sₙ]) = ∑ᵢ pᵢ U(Sᵢ).</desc><rect width="100%" height="100%" fill="white"/><text x="2" y="68" font-size="89" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="940" lengthAdjust="spacingAndGlyphs" font-style="italic">U(A) ≥ U(B) ⇔ A ⪰ B</text><text x="2" y="200" font-size="86" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="1410" lengthAdjust="spacingAndGlyphs" font-style="italic">U([p<tspan baseline-shift="-10" font-size="65%">1</tspan>, S<tspan baseline-shift="-10" font-size="65%">1</tspan>; … ; p<tspan baseline-shift="-10" font-size="65%">n</tspan>, S<tspan baseline-shift="-10" font-size="65%">n</tspan>]) = ∑<tspan baseline-shift="-10" font-size="65%">i</tspan>p<tspan baseline-shift="-10" font-size="65%">i</tspan>U(S<tspan baseline-shift="-10" font-size="65%">i</tspan>)</text></svg>
