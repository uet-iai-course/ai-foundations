<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1394 90" role="img" data-redrawn="manual" aria-labelledby="title desc"><title id="title">Biến đổi tuyến tính hàm lợi ích</title><desc id="desc">U′(x) = k₁ U(x) + k₂ where k₁ &gt; 0.</desc><rect width="100%" height="100%" fill="white"/><g data-source-ink-fit="true" transform="matrix(1.01235465116 0 0 1.30769230769 -11.148255814 -16.6153846154)"><text x="2" y="66" font-size="75" font-family="STIX, Times New Roman, Liberation Serif, serif" fill="#c00000" textLength="780" lengthAdjust="spacingAndGlyphs" font-style="italic">U′(x) = k<tspan baseline-shift="-10" font-size="65%">1</tspan>U(x) + k<tspan baseline-shift="-10" font-size="65%">2</tspan></text><text x="936" y="66" font-size="65" font-family="Arial, Liberation Sans, sans-serif" fill="#c00000" textLength="452" lengthAdjust="spacingAndGlyphs">where <tspan font-family="STIX" font-style="italic">k<tspan baseline-shift="-10" font-size="65%">1</tspan> &gt; 0</tspan></text></g></svg>
