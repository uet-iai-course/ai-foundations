<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7366 333" role="img" data-redrawn="manual" aria-labelledby="title desc"><title>Eval(s) = w₁f₁(s) + w₂f₂(s) + … + wₙfₙ(s)</title><desc>Hàm Eval(s) là tổng các đặc trưng fᵢ(s) nhân trọng số wᵢ.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Latin Modern Roman, STIX, Times New Roman, Liberation Serif, serif" fill="black"><text x="10" y="260" font-size="300" textLength="7346" lengthAdjust="spacingAndGlyphs"><tspan font-style="italic">Eval</tspan><tspan>(</tspan><tspan font-style="italic">s</tspan><tspan>) = </tspan><tspan font-style="italic">w</tspan><tspan baseline-shift="-40" font-size="200">1</tspan><tspan font-style="italic">f</tspan><tspan baseline-shift="-40" font-size="200">1</tspan><tspan>(</tspan><tspan font-style="italic">s</tspan><tspan>)</tspan><tspan> + </tspan><tspan font-style="italic">w</tspan><tspan baseline-shift="-40" font-size="200">2</tspan><tspan font-style="italic">f</tspan><tspan baseline-shift="-40" font-size="200">2</tspan><tspan>(</tspan><tspan font-style="italic">s</tspan><tspan>)</tspan><tspan> + … + </tspan><tspan font-style="italic">w</tspan><tspan font-style="italic" baseline-shift="-40" font-size="200">n</tspan><tspan font-style="italic">f</tspan><tspan font-style="italic" baseline-shift="-40" font-size="200">n</tspan><tspan>(</tspan><tspan font-style="italic">s</tspan><tspan>)</tspan></text></g></svg>
