<svg data-redrawn="manual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="title desc"><title id="title">Vòng điều khiển có cảm biến phản hồi</title><desc id="desc">Đầu vào đến bộ điều khiển, cơ cấu chấp hành tạo đầu ra. Cảm biến nhận đầu ra và phản hồi về bộ điều khiển.</desc><defs><marker id="a" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" fill="#577695"/></marker></defs><g fill="none" stroke="#577695" stroke-width="8" marker-end="url(#a)"><path d="M15 85H175"/><path d="M325 85H426"/><path d="M598 85H756"/><path d="M683 95V156Q683 198 637 198H486"/><path d="M335 198H270Q235 198 235 160V137"/></g><g fill="#ffe7a1" stroke="#786745" stroke-width="2"><rect x="177" y="45" width="150" height="85" rx="18"/><rect x="429" y="45" width="170" height="85" rx="18"/><rect x="336" y="156" width="150" height="85" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172333"><text x="80" y="62" font-size="22">Input</text><text x="252" y="96" font-size="25" font-weight="bold">Controller</text><text x="514" y="96" font-size="25" font-weight="bold">Actuator</text><text x="680" y="62" font-size="22">Output</text><text x="411" y="208" font-size="25" font-weight="bold">Sensor</text></g></svg>