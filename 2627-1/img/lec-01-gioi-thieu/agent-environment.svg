<svg data-redrawn="manual" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="title desc">
<title id="title">Tác tử nhận thức môi trường qua cảm biến và tác động lên môi trường qua cơ cấu chấp hành</title>
<desc id="desc">Môi trường gửi nhận thức đến cảm biến. Bên trong tác tử, bộ phận được ký hiệu bằng dấu hỏi nối cảm biến với cơ cấu chấp hành. Cơ cấu chấp hành gửi hành động đến môi trường.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#172333" stroke-width="1.5"/></marker></defs>
<g fill="#b5c5df" stroke="#172333" stroke-width="2"><rect x="20" y="20" width="295" height="250" rx="24"/><rect x="500" y="20" width="205" height="250" rx="24"/></g>
<g font-family="Arial,sans-serif" fill="#172333" font-size="28" text-anchor="middle">
<text x="95" y="58" font-weight="bold">Tác tử</text><text x="602" y="58" font-weight="bold">Môi trường</text>
<text x="173" y="94">Cảm biến</text><text x="173" y="219">Cơ cấu</text><text x="173" y="250">chấp hành</text>
<text x="405" y="123" font-size="23">Nhận thức</text><text x="410" y="217" font-size="23">Hành động</text>
</g>
<g fill="none" stroke="#172333" stroke-width="4" marker-end="url(#arrow)"><path d="M555 94H256"/><path d="M258 185H554"/><path d="M173 103V194" stroke-width="2"/></g>
<rect x="143" y="120" width="60" height="48" rx="12" fill="white" stroke="#172333" stroke-width="2"/><text x="173" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">?</text>
</svg>
